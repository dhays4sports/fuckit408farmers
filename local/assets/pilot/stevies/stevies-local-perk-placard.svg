<title id="t">408FARMERS Local perk at Stevie's Bar &amp; Grill</title><desc id="d">Print-ready pilot placard with a QR code for a Stevie's Local perk.</desc>
<rect width="1500" height="2100" fill="#071a33" rx="70"/>
<text x="110" y="180" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="700">408FARMERS LOCAL</text>
<rect x="110" y="235" width="180" height="12" fill="#d62828"/>
<text x="110" y="420" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="108" font-weight="800">A LOCAL PERK</text>
<text x="110" y="545" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="108" font-weight="800">AT STEVIE'S</text>
<text x="110" y="710" fill="#d9e5f5" font-family="Arial,Helvetica,sans-serif" font-size="54">20% off food + non-alcoholic drinks</text>
